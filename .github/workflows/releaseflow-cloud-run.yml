name: Release Flow Orchestrator ♻️

on:
  workflow_call:
    outputs:
      promo_ref:
        description: "Ref promovida, normalmente release/**"
        value: ${{ jobs.ctx.outputs.promo_ref }}
      image_by_digest:
        description: "Imagem imutável promovida no GAR"
        value: ${{ jobs.resolve_digest.outputs.image_by_digest }}
      digest:
        description: "Digest sha256 promovido"
        value: ${{ jobs.resolve_digest.outputs.digest }}
      used_tag:
        description: "Tag usada para localizar o digest no GAR"
        value: ${{ jobs.resolve_digest.outputs.used_tag }}
      pr_number:
        description: "PR associada à imagem promovida"
        value: ${{ jobs.resolve_digest.outputs.pr_number }}
      release_please_pr_url:
        description: "URL da PR criada ou atualizada pelo release-please"
        value: ${{ jobs.release_please_pr.outputs.pr_url }}
      release_please_pr_number:
        description: "Número da PR do release-please"
        value: ${{ jobs.release_please_pr.outputs.pr_number }}
      tag_name:
        description: "Tag SemVer criada pelo release-please"
        value: ${{ jobs.release_please_publish.outputs.tag_name }}
      image_ref:
        description: "Referência SemVer criada no GAR"
        value: ${{ jobs.tag_release_image.outputs.image_ref }}
      service_url_hml:
        description: "URL do serviço Cloud Run em HML"
        value: ${{ jobs.deploy_hml.outputs.service_url }}
      revision_hml:
        description: "Revisão implantada em HML"
        value: ${{ jobs.deploy_hml.outputs.revision }}
      service_url_prd:
        description: "URL do serviço Cloud Run em PRD"
        value: ${{ jobs.deploy_prd.outputs.service_url }}
      revision_prd:
        description: "Revisão implantada em PRD"
        value: ${{ jobs.deploy_prd.outputs.revision }}
      revision_tag_prd:
        description: "Revision tag do Cloud Run derivada do SemVer"
        value: ${{ jobs.deploy_prd.outputs.revision_tag }}
      sync_pr_url:
        description: "URL da PR de sincronização release → main"
        value: ${{ jobs.sync_release_to_main.outputs.pr_url }}
      sync_pr_number:
        description: "Número da PR de sincronização release → main"
        value: ${{ jobs.sync_release_to_main.outputs.pr_number }}

    inputs:
      runs_on:
        description: 'Runner labels em JSON. Ex.: ["self-hosted","dev"]'
        type: string
        required: false
        default: '["self-hosted","dev"]'

      main_branch:
        type: string
        required: false
        default: "main"

      release_prefix:
        type: string
        required: false
        default: "release/"

      trigger_event_name:
        type: string
        required: false
        default: ""

      # Build Docker / Artifact Registry
      dockerfile:
        type: string
        required: false
        default: "Dockerfile"

      context:
        type: string
        required: false
        default: "."

      build_args:
        description: "Build args em KEY=VALUE, um por linha"
        type: string
        required: false
        default: ""

      gcp_registry_host:
        description: "Host do GAR. Vazio => vars.GCP_REGISTRY_HOST"
        type: string
        required: false
        default: ""

      gcp_registry_project_id:
        description: "Projeto que contém o GAR. Vazio => vars.GCP_REGISTRY_PROJECT_ID ou vars.GCP_PROJECT_ID"
        type: string
        required: false
        default: ""

      gcp_registry_repo:
        description: "Repositório Docker no GAR. Vazio => vars.GCP_REGISTRY_REPO"
        type: string
        required: false
        default: ""

      gcp_image_name:
        description: "Nome da imagem no GAR. Vazio => nome do repositório GitHub"
        type: string
        required: false
        default: ""

      gcp_build_workload_identity_provider:
        description: "WIF usado para build, leitura e tag no GAR"
        type: string
        required: false
        default: ""

      gcp_build_service_account:
        description: "Service Account usada para build, leitura e tag no GAR"
        type: string
        required: false
        default: ""

      # Arquivos obrigatórios no padrão da plataforma
      config_file_hml:
        description: "Configuração Cloud Run de HML"
        type: string
        required: false
        default: ".cloudrun/hml.yaml"

      config_file_prd:
        description: "Configuração Cloud Run de PRD"
        type: string
        required: false
        default: ".cloudrun/prd.yaml"

      enable_deploy_hml:
        type: string
        required: false
        default: "true"

      enable_deploy_prd:
        type: string
        required: false
        default: "true"

      service_name:
        description: "Nome padrão do serviço; vazio usa o nome do repositório"
        type: string
        required: false
        default: ""

      service_name_hml:
        type: string
        required: false
        default: ""

      service_name_prd:
        type: string
        required: false
        default: ""

      project_id_hml:
        description: "Vazio => vars.GCP_PROJECT_ID do Environment HML"
        type: string
        required: false
        default: ""

      project_id_prd:
        description: "Vazio => vars.GCP_PROJECT_ID do Environment PRD"
        type: string
        required: false
        default: ""

      region_hml:
        type: string
        required: false
        default: ""

      region_prd:
        type: string
        required: false
        default: ""

      gcp_workload_identity_provider_hml:
        type: string
        required: false
        default: ""

      gcp_workload_identity_provider_prd:
        type: string
        required: false
        default: ""

      gcp_deploy_service_account_hml:
        type: string
        required: false
        default: ""

      gcp_deploy_service_account_prd:
        type: string
        required: false
        default: ""

      runtime_service_account_hml:
        type: string
        required: false
        default: ""

      runtime_service_account_prd:
        type: string
        required: false
        default: ""

      gcloud_version:
        type: string
        required: false
        default: latest

      timeout_job:
        type: number
        required: false
        default: 30

      release_please_config:
        type: string
        required: false
        default: "release-please-config.json"

      release_please_manifest:
        type: string
        required: false
        default: ".release-please-manifest.json"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  ctx:
    name: Context 🔎
    runs-on: ${{ fromJson(inputs.runs_on) }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      event_name: ${{ steps.ctx.outputs.event_name }}
      head_branch: ${{ steps.ctx.outputs.head_branch }}
      base_branch: ${{ steps.ctx.outputs.base_branch }}
      head_kind: ${{ steps.ctx.outputs.head_kind }}

      is_bot_branch: ${{ steps.ctx.outputs.is_bot_branch }}
      bot_kind: ${{ steps.ctx.outputs.bot_kind }}

      is_dev_flow: ${{ steps.ctx.outputs.is_dev_flow }}
      is_release_flow: ${{ steps.ctx.outputs.is_release_flow }}
      release_id: ${{ steps.ctx.outputs.release_id }}
      release_name: ${{ steps.ctx.outputs.release_name }}
      app_name: ${{ steps.ctx.outputs.app_name }}

      pr_action: ${{ steps.ctx.outputs.pr_action }}
      pr_merged: ${{ steps.ctx.outputs.pr_merged }}

      should_run_release_promotion: ${{ steps.ctx.outputs.should_run_release_promotion }}
      promo_ref: ${{ steps.ctx.outputs.promo_ref }}

      is_release_push: ${{ steps.ctx.outputs.is_release_push }}
      is_release_please_merge_push: ${{ steps.ctx.outputs.is_release_please_merge_push }}
      should_run_release_please_pr: ${{ steps.ctx.outputs.should_run_release_please_pr }}
      should_run_release_please_publish: ${{ steps.ctx.outputs.should_run_release_please_publish }}

    steps:
      - name: Determine Context 🔎
        id: ctx
        run: |
          set -euo pipefail

          sanitize_name() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' \
              | cut -c1-63
          }

          EVENT_NAME="${{ inputs.trigger_event_name }}"
          if [[ -z "${EVENT_NAME}" ]]; then EVENT_NAME="${GITHUB_EVENT_NAME}"; fi

          PR_ACTION=""
          PR_MERGED="false"
          HEAD_BRANCH=""
          BASE_BRANCH=""

          case "${EVENT_NAME}" in
            pull_request|pull_request_target)
              PR_ACTION="${{ github.event.action }}"
              PR_MERGED="${{ github.event.pull_request.merged }}"
              [[ "${PR_MERGED}" == "true" ]] || PR_MERGED="false"
              HEAD_BRANCH="${GITHUB_HEAD_REF:-}"
              BASE_BRANCH="${GITHUB_BASE_REF:-}"
              ;;
            create)
              HEAD_BRANCH="${GITHUB_REF_NAME:-${{ github.event.ref }}}"
              BASE_BRANCH=""
              ;;
            push)
              HEAD_BRANCH="${GITHUB_REF_NAME:-}"
              BASE_BRANCH=""
              ;;
            *)
              HEAD_BRANCH="${GITHUB_REF_NAME:-}"
              BASE_BRANCH=""
              ;;
          esac

          RELEASE_PREFIX="${{ inputs.release_prefix }}"
          MAIN_BRANCH="${{ inputs.main_branch }}"

          IS_BOT="false"
          BOT_KIND=""
          if [[ "${HEAD_BRANCH}" == release-please--* ]]; then IS_BOT="true"; BOT_KIND="release-please"; fi
          if [[ "${HEAD_BRANCH}" == dependabot/* ]]; then IS_BOT="true"; BOT_KIND="dependabot"; fi

          HEAD_KIND="other"
          if [[ "${IS_BOT}" == "true" ]]; then
            HEAD_KIND="bot"
          elif [[ "${HEAD_BRANCH}" == "feature/"* ]]; then
            HEAD_KIND="feature"
          elif [[ "${HEAD_BRANCH}" == "bugfix/"* ]]; then
            HEAD_KIND="bugfix"
          elif [[ "${HEAD_BRANCH}" == "hotfix/"* ]]; then
            HEAD_KIND="hotfix"
          elif [[ "${HEAD_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            HEAD_KIND="release"
          elif [[ "${HEAD_BRANCH}" == "${MAIN_BRANCH}" ]]; then
            HEAD_KIND="main"
          fi

          IS_DEV_FLOW="false"
          if [[ "${EVENT_NAME}" == "pull_request" && "${PR_ACTION}" != "closed" ]]; then
            if [[ "${HEAD_KIND}" == "feature" || "${HEAD_KIND}" == "bugfix" || "${HEAD_KIND}" == "hotfix" ]]; then
              if [[ "${BASE_BRANCH}" == "${MAIN_BRANCH}" || "${BASE_BRANCH}" == "${RELEASE_PREFIX}"* || "${BASE_BRANCH}" == "feature/"* ]]; then
                IS_DEV_FLOW="true"
              fi
            fi
          fi

          IS_RELEASE_FLOW="false"
          if [[ "${HEAD_KIND}" == "release" ]]; then IS_RELEASE_FLOW="true"; fi

          RELEASE_ID=""
          if [[ "${HEAD_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            RELEASE_ID="${HEAD_BRANCH#${RELEASE_PREFIX}}"
          elif [[ "${BASE_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            RELEASE_ID="${BASE_BRANCH#${RELEASE_PREFIX}}"
          fi

          APP_NAME="${{ github.event.repository.name }}"
          RELEASE_NAME="$(sanitize_name "${APP_NAME}")"

          SHOULD_RUN_RELEASE_PROMOTION="false"
          PROMO_REF=""

          # detect branch-creation push (release/** created from main tip)
          PUSH_CREATED="${{ github.event.created }}"
          [[ "${PUSH_CREATED}" == "true" ]] || PUSH_CREATED="false"
          BEFORE_SHA="${{ github.event.before }}"

          if [[ "${EVENT_NAME}" == "create" && "${HEAD_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            SHOULD_RUN_RELEASE_PROMOTION="true"
            PROMO_REF="${HEAD_BRANCH}"
          fi

          # If caller removed `on.create {}`, creation of release/** arrives as `push` with created=true and before=0000...
          if [[ "${EVENT_NAME}" == "push" && "${HEAD_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            if [[ "${PUSH_CREATED}" == "true" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              SHOULD_RUN_RELEASE_PROMOTION="true"
              PROMO_REF="${HEAD_BRANCH}"
            fi
          fi

          # PR merged -> release/**: somente bugfix/** e hotfix/** (release-please/dependabot não devem promover)
          if [[ "${EVENT_NAME}" == "pull_request" && "${PR_ACTION}" == "closed" && "${PR_MERGED}" == "true" && "${BASE_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            if [[ "${IS_BOT}" != "true" ]]; then
              if [[ "${HEAD_KIND}" == "bugfix" || "${HEAD_KIND}" == "hotfix" ]]; then
                SHOULD_RUN_RELEASE_PROMOTION="true"
                PROMO_REF="${BASE_BRANCH}"
              fi
            fi
          fi

          IS_RELEASE_PUSH="false"
          if [[ "${EVENT_NAME}" == "push" && "${HEAD_BRANCH}" == "${RELEASE_PREFIX}"* ]]; then
            IS_RELEASE_PUSH="true"
          fi

          IS_RELEASE_PLEASE_MERGE_PUSH="false"
          if [[ "${EVENT_NAME}" == "push" && "${IS_RELEASE_PUSH}" == "true" ]]; then
            GH_TOKEN="${{ github.token }}"
            PULLS_JSON="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls?per_page=10" || true)"

            IS_RP="$(python3 -c "import json,sys; s=sys.stdin.read().strip(); d=json.loads(s) if s else []; print(\"true\" if any(((pr.get(\"head\") or {}).get(\"ref\",\"\")).startswith(\"release-please--\") for pr in d) else \"false\")" <<<"${PULLS_JSON}")"
            [[ "${IS_RP}" == "true" ]] && IS_RELEASE_PLEASE_MERGE_PUSH="true"
          fi

          SHOULD_RUN_RELEASE_PLEASE_PR="false"
          SHOULD_RUN_RELEASE_PLEASE_PUBLISH="false"
          [[ "${SHOULD_RUN_RELEASE_PROMOTION}" == "true" ]] && SHOULD_RUN_RELEASE_PLEASE_PR="true"
          [[ "${IS_RELEASE_PLEASE_MERGE_PUSH}" == "true" ]] && SHOULD_RUN_RELEASE_PLEASE_PUBLISH="true"

          {
            echo "event_name=${EVENT_NAME}"
            echo "head_branch=${HEAD_BRANCH}"
            echo "base_branch=${BASE_BRANCH}"
            echo "head_kind=${HEAD_KIND}"
            echo "is_bot_branch=${IS_BOT}"
            echo "bot_kind=${BOT_KIND}"
            echo "is_dev_flow=${IS_DEV_FLOW}"
            echo "is_release_flow=${IS_RELEASE_FLOW}"
            echo "pr_action=${PR_ACTION}"
            echo "pr_merged=${PR_MERGED}"
            echo "should_run_release_promotion=${SHOULD_RUN_RELEASE_PROMOTION}"
            echo "promo_ref=${PROMO_REF}"
            echo "is_release_push=${IS_RELEASE_PUSH}"
            echo "is_release_please_merge_push=${IS_RELEASE_PLEASE_MERGE_PUSH}"
            echo "should_run_release_please_pr=${SHOULD_RUN_RELEASE_PLEASE_PR}"
            echo "should_run_release_please_publish=${SHOULD_RUN_RELEASE_PLEASE_PUBLISH}"
            echo "release_id=${RELEASE_ID}"
            echo "release_name=${RELEASE_NAME}"
            echo "app_name=${APP_NAME}"
          } >> "$GITHUB_OUTPUT"


  registry:
    name: Resolve GAR Context 📦
    needs: [ctx]
    if: >-
      ${{
        needs.ctx.outputs.is_dev_flow == 'true' ||
        needs.ctx.outputs.should_run_release_promotion == 'true' ||
        needs.ctx.outputs.should_run_release_please_publish == 'true'
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    outputs:
      registry_host: ${{ steps.registry.outputs.registry_host }}
      registry_project_id: ${{ steps.registry.outputs.registry_project_id }}
      registry_repo: ${{ steps.registry.outputs.registry_repo }}
      image_name: ${{ steps.registry.outputs.image_name }}
      wif_provider: ${{ steps.registry.outputs.wif_provider }}
      service_account: ${{ steps.registry.outputs.service_account }}
      image_uri: ${{ steps.registry.outputs.image_uri }}
    steps:
      - name: Resolve GAR Settings
        id: registry
        env:
          INPUT_HOST: ${{ inputs.gcp_registry_host }}
          INPUT_PROJECT: ${{ inputs.gcp_registry_project_id }}
          INPUT_REPO: ${{ inputs.gcp_registry_repo }}
          INPUT_IMAGE_NAME: ${{ inputs.gcp_image_name }}
          INPUT_WIF: ${{ inputs.gcp_build_workload_identity_provider }}
          INPUT_SA: ${{ inputs.gcp_build_service_account }}
          VAR_HOST: ${{ vars.GCP_REGISTRY_HOST }}
          VAR_REGISTRY_PROJECT: ${{ vars.GCP_REGISTRY_PROJECT_ID }}
          VAR_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          VAR_REPO: ${{ vars.GCP_REGISTRY_REPO }}
          VAR_WIF: ${{ vars.GCP_WIF_PROVIDER }}
          VAR_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          first_non_empty() {
            local value
            for value in "$@"; do
              if [[ -n "$value" ]]; then
                printf '%s' "$value"
                return 0
              fi
            done
            return 1
          }

          HOST="$(first_non_empty "$INPUT_HOST" "$VAR_HOST" "southamerica-east1-docker.pkg.dev")"
          PROJECT="$(first_non_empty "$INPUT_PROJECT" "$VAR_REGISTRY_PROJECT" "$VAR_PROJECT" || true)"
          REPO="$(first_non_empty "$INPUT_REPO" "$VAR_REPO" || true)"
          WIF="$(first_non_empty "$INPUT_WIF" "$VAR_WIF" || true)"
          SA="$(first_non_empty "$INPUT_SA" "$VAR_SA" || true)"

          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%/}"

          : "${PROJECT:?Defina gcp_registry_project_id, vars.GCP_REGISTRY_PROJECT_ID ou vars.GCP_PROJECT_ID}"
          : "${REPO:?Defina gcp_registry_repo ou vars.GCP_REGISTRY_REPO}"
          : "${WIF:?Defina gcp_build_workload_identity_provider ou vars.GCP_WIF_PROVIDER}"
          : "${SA:?Defina gcp_build_service_account ou vars.GCP_SERVICE_ACCOUNT}"

          APP="${GITHUB_REPOSITORY##*/}"
          IMAGE_NAME="$(first_non_empty "$INPUT_IMAGE_NAME" "$APP")"
          IMAGE_NAME="$(printf '%s' "$IMAGE_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._/-]+#-#g; s#(^/+|/+$)##g; s#/{2,}#/#g')"

          if [[ -z "$IMAGE_NAME" ]]; then
            echo "::error::gcp_image_name ficou vazio após sanitização."
            exit 1
          fi

          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._/-]?[a-z0-9]+)*$ ]]; then
            echo "::error::gcp_image_name inválido após sanitização: ${IMAGE_NAME}"
            echo "::error::Use apenas lowercase, números, ponto, underline, hífen e barra."
            exit 1
          fi

          IMAGE_URI="${HOST}/${PROJECT}/${REPO}/${IMAGE_NAME}"

          echo "registry_host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "registry_project_id=${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "registry_repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "wif_provider=${WIF}" >> "$GITHUB_OUTPUT"
          echo "service_account=${SA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          {
            echo "### GAR Context"
            echo "- host: \`${HOST}\`"
            echo "- project: \`${PROJECT}\`"
            echo "- repository: \`${REPO}\`"
            echo "- image: \`${IMAGE_URI}\`"
            echo "- service_account: \`${SA}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  build:
    name: Build & Push GAR ♻️
    needs: [ctx, registry]
    if: >-
      ${{
        needs.ctx.outputs.event_name == 'pull_request' &&
        needs.ctx.outputs.pr_action != 'closed' &&
        needs.ctx.outputs.is_dev_flow == 'true' &&
        needs.ctx.result == 'success' &&
        needs.registry.result == 'success'
      }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/build-docker.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      build_args: ${{ inputs.build_args }}
      push_to_nexus: false
      push_to_gcp: true
      push_sha_tag: true
      gcp_registry_host: ${{ needs.registry.outputs.registry_host }}
      gcp_project_id: ${{ needs.registry.outputs.registry_project_id }}
      gcp_registry_repo: ${{ needs.registry.outputs.registry_repo }}
      gcp_image_name: ${{ needs.registry.outputs.image_name }}
      gcp_workload_identity_provider: ${{ needs.registry.outputs.wif_provider }}
      gcp_service_account: ${{ needs.registry.outputs.service_account }}


  resolve_digest:
    name: Resolve GAR Digest 🧾
    needs: [ctx, registry]
    if: >-
      ${{
        needs.registry.result == 'success' &&
        (
          needs.ctx.outputs.should_run_release_promotion == 'true' ||
          needs.ctx.outputs.should_run_release_please_publish == 'true'
        )
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      image_uri: ${{ steps.out.outputs.image_uri }}
      digest: ${{ steps.out.outputs.digest }}
      image_by_digest: ${{ steps.out.outputs.image_by_digest }}
      used_tag: ${{ steps.out.outputs.used_tag }}
      pr_number: ${{ steps.out.outputs.pr_number }}
      pr_head_sha: ${{ steps.out.outputs.pr_head_sha }}
    steps:
      - name: Checkout Promotion Ref 📥
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.ctx.outputs.promo_ref != '' && needs.ctx.outputs.promo_ref || github.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud 🔐
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ needs.registry.outputs.registry_project_id }}
          workload_identity_provider: ${{ needs.registry.outputs.wif_provider }}
          service_account: ${{ needs.registry.outputs.service_account }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK ☁️
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ${{ inputs.gcloud_version }}
          project_id: ${{ needs.registry.outputs.registry_project_id }}

      - name: Resolve Image Digest
        id: out
        env:
          IMAGE_URI: ${{ needs.registry.outputs.image_uri }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_FLOW: ${{ needs.ctx.outputs.should_run_release_please_publish }}
        run: |
          set -euo pipefail

          fetch_digest_for_tag() {
            local tag="$1"
            local payload digest

            payload="$(gcloud artifacts docker images describe "${IMAGE_URI}:${tag}" \
              --project="${{ needs.registry.outputs.registry_project_id }}" \
              --format=json 2>/dev/null || true)"

            [[ -n "$payload" ]] || return 1

            digest="$(PAYLOAD="$payload" python3 <<'PY_INNER'
          import json
          import os
          import re

          try:
              data = json.loads(os.environ.get("PAYLOAD", "{}"))
          except json.JSONDecodeError:
              print("")
              raise SystemExit(0)

          candidates = [
              ((data.get("image_summary") or {}).get("digest")),
              ((data.get("imageSummary") or {}).get("digest")),
              ((data.get("image_summary") or {}).get("fully_qualified_digest")),
              ((data.get("imageSummary") or {}).get("fullyQualifiedDigest")),
              data.get("digest"),
              data.get("fully_qualified_digest"),
          ]

          for value in candidates:
              if not value:
                  continue
              match = re.search(r"sha256:[0-9a-fA-F]{64}", str(value))
              if match:
                  print(match.group(0).lower())
                  raise SystemExit(0)

          print("")
          PY_INNER
            )"

            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }

          COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ "$PUBLISH_FLOW" == "true" && -n "${{ github.event.before }}" ]]; then
            COMMIT_SHA="${{ github.event.before }}"
          fi

          PULLS_JSON="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls?per_page=10" || true)"

          readarray -t PR_DATA < <(PULLS_JSON="$PULLS_JSON" python3 <<'PY_INNER'
          import json
          import os

          try:
              pulls = json.loads(os.environ.get("PULLS_JSON", "[]"))
          except json.JSONDecodeError:
              pulls = []

          selected = None
          for pr in pulls if isinstance(pulls, list) else []:
              ref = ((pr.get("head") or {}).get("ref") or "")
              if not ref.startswith("release-please--") and not ref.startswith("dependabot/"):
                  selected = pr
                  break
          if selected is None and pulls:
              selected = pulls[0]

          print(str((selected or {}).get("number") or ""))
          print(str(((selected or {}).get("head") or {}).get("sha") or ""))
          PY_INNER
          )

          PR_NUMBER="${PR_DATA[0]:-}"
          HEAD_SHA="${PR_DATA[1]:-}"
          [[ -n "$HEAD_SHA" ]] || HEAD_SHA="$COMMIT_SHA"
          SHA7="${HEAD_SHA:0:7}"

          CANDIDATES=()
          if [[ -n "$PR_NUMBER" ]]; then
            CANDIDATES+=("pr-${PR_NUMBER}-${SHA7}-rc")
          fi
          CANDIDATES+=("sha-${HEAD_SHA}")
          if [[ "$HEAD_SHA" != "$COMMIT_SHA" ]]; then
            CANDIDATES+=("sha-${COMMIT_SHA}")
          fi

          DIGEST=""
          USED_TAG=""
          for tag in "${CANDIDATES[@]}"; do
            digest="$(fetch_digest_for_tag "$tag" || true)"
            if [[ -n "$digest" ]]; then
              DIGEST="$digest"
              USED_TAG="$tag"
              break
            fi
          done

          if [[ -z "$DIGEST" ]]; then
            echo "::error::Não encontrei uma imagem no GAR para as tags: ${CANDIDATES[*]}"
            echo "::error::Imagem base: ${IMAGE_URI}"
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "used_tag=${USED_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_by_digest=${IMAGE_URI}@${DIGEST}" >> "$GITHUB_OUTPUT"

          {
            echo "### Resolve GAR digest"
            echo "- image: \`${IMAGE_URI}\`"
            echo "- used_tag: \`${USED_TAG}\`"
            echo "- PR: \`${PR_NUMBER:-n/a}\`"
            echo "- head_sha: \`${HEAD_SHA}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- image_by_digest: \`${IMAGE_URI}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  deploy_hml:
    name: Deploy HML 🧪
    needs: [ctx, resolve_digest]
    if: >-
      ${{
        always() &&
        inputs.enable_deploy_hml == 'true' &&
        needs.ctx.outputs.should_run_release_promotion == 'true' &&
        needs.resolve_digest.result == 'success' &&
        needs.resolve_digest.outputs.image_by_digest != ''
      }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy-cloud-run.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      environment: HML
      config_file: ${{ inputs.config_file_hml }}
      project_id: ${{ inputs.project_id_hml }}
      region: ${{ inputs.region_hml }}
      service_name: ${{ inputs.service_name_hml != '' && inputs.service_name_hml || inputs.service_name }}
      image_ref: ${{ needs.resolve_digest.outputs.image_by_digest }}
      require_image_digest: true
      gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider_hml }}
      gcp_deploy_service_account: ${{ inputs.gcp_deploy_service_account_hml }}
      runtime_service_account: ${{ inputs.runtime_service_account_hml }}
      gcloud_version: ${{ inputs.gcloud_version }}
      timeout_job: ${{ inputs.timeout_job }}

  release_please_pr:
    name: Release Pull Request 🔗
    environment: Release
    needs: [ctx, resolve_digest, deploy_hml]
    if: >-
      ${{
        always() &&
        needs.ctx.outputs.should_run_release_please_pr == 'true' &&
        needs.resolve_digest.result == 'success' &&
        (inputs.enable_deploy_hml != 'true' || needs.deploy_hml.result == 'success')
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Pick Token
        id: tok
        run: |
          set -euo pipefail
          T="${{ secrets.RELEASE_PLEASE_TOKEN }}"
          if [[ -z "${T:-}" ]]; then T="${{ github.token }}"; fi
          echo "token=${T}" >> "$GITHUB_OUTPUT"

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.tok.outputs.token }}
          config-file: ${{ inputs.release_please_config }}
          manifest-file: ${{ inputs.release_please_manifest }}
          target-branch: ${{ needs.ctx.outputs.promo_ref }}
          skip-github-release: true

      - name: Capture Release-Please PR 🔗
        id: pr
        env:
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail

          PR_NUMBERS="$(python3 - <<'PY_INNER'
          import json
          import os

          try:
              prs = json.loads(os.environ.get("PRS", "") or "[]")
          except json.JSONDecodeError:
              prs = []

          print(",".join(str(pr["number"]) for pr in prs if pr.get("number") is not None))
          PY_INNER
          )"

          FIRST_PR_NUMBER="${PR_NUMBERS%%,*}"
          PR_URL=""
          if [[ -n "$FIRST_PR_NUMBER" ]]; then
            PR_URL="${{ github.server_url }}/${GITHUB_REPOSITORY}/pull/${FIRST_PR_NUMBER}"
          fi

          echo "pr_number=${FIRST_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Release Please"
            if [[ -n "$PR_NUMBERS" ]]; then
              echo "- PR(s): \`${PR_NUMBERS}\`"
            else
              echo "- PR: nenhuma PR criada ou atualizada"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  release_please_publish:
    name: Create Tag On GitHub 🏷️
    needs: [ctx, resolve_digest]
    if: >-
      ${{
        needs.ctx.outputs.should_run_release_please_publish == 'true'
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Pick Token
        id: tok
        run: |
          set -euo pipefail
          T="${{ secrets.RELEASE_PLEASE_TOKEN }}"
          if [[ -z "${T:-}" ]]; then T="${{ github.token }}"; fi
          echo "token=${T}" >> "$GITHUB_OUTPUT"

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.tok.outputs.token }}
          config-file: ${{ inputs.release_please_config }}
          manifest-file: ${{ inputs.release_please_manifest }}
          target-branch: ${{ needs.ctx.outputs.head_branch }}
          skip-github-pull-request: true


  tag_release_image:
    name: Tag Release Image On GAR 🏷️
    needs: [ctx, registry, resolve_digest, release_please_publish]
    if: >-
      ${{
        needs.ctx.outputs.should_run_release_please_publish == 'true' &&
        needs.registry.result == 'success' &&
        needs.resolve_digest.result == 'success' &&
        needs.release_please_publish.outputs.releases_created == 'true' &&
        needs.release_please_publish.outputs.tag_name != '' &&
        needs.resolve_digest.outputs.digest != ''
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.tag.outputs.image_ref }}
      image_by_digest: ${{ steps.tag.outputs.image_by_digest }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Authenticate to Google Cloud 🔐
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ needs.registry.outputs.registry_project_id }}
          workload_identity_provider: ${{ needs.registry.outputs.wif_provider }}
          service_account: ${{ needs.registry.outputs.service_account }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK ☁️
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ${{ inputs.gcloud_version }}
          project_id: ${{ needs.registry.outputs.registry_project_id }}

      - name: Add SemVer Tag
        id: tag
        env:
          IMAGE_URI: ${{ needs.registry.outputs.image_uri }}
          DIGEST: ${{ needs.resolve_digest.outputs.digest }}
          TAG_NAME: ${{ needs.release_please_publish.outputs.tag_name }}
        run: |
          set -euo pipefail

          SOURCE="${IMAGE_URI}@${DIGEST}"
          TARGET="${IMAGE_URI}:${TAG_NAME}"

          gcloud artifacts docker tags add "$SOURCE" "$TARGET" \
            --project="${{ needs.registry.outputs.registry_project_id }}" \
            --quiet

          RESOLVED="$(gcloud artifacts docker images describe "$TARGET" \
            --project="${{ needs.registry.outputs.registry_project_id }}" \
            --format=json)"

          RESOLVED_DIGEST="$(PAYLOAD="$RESOLVED" python3 <<'PY_INNER'
          import json
          import os
          import re

          data = json.loads(os.environ["PAYLOAD"])
          text = json.dumps(data)
          match = re.search(r"sha256:[0-9a-fA-F]{64}", text)
          print(match.group(0).lower() if match else "")
          PY_INNER
          )"

          if [[ "$RESOLVED_DIGEST" != "$DIGEST" ]]; then
            echo "::error::A tag ${TAG_NAME} não aponta para o digest esperado. Esperado=${DIGEST}; encontrado=${RESOLVED_DIGEST:-vazio}"
            exit 1
          fi

          echo "image_ref=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "image_by_digest=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          {
            echo "### GAR Release Tag"
            echo "- source: \`${SOURCE}\`"
            echo "- tag: \`${TARGET}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  deploy_prd:
    name: Deploy PRD 🚀
    needs: [ctx, resolve_digest, tag_release_image]
    if: >-
      ${{
        inputs.enable_deploy_prd == 'true' &&
        needs.ctx.outputs.should_run_release_please_publish == 'true' &&
        needs.tag_release_image.result == 'success' &&
        needs.resolve_digest.outputs.image_by_digest != ''
      }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy-cloud-run-preflight.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      environment: PRD
      config_file: ${{ inputs.config_file_prd }}
      project_id: ${{ inputs.project_id_prd }}
      region: ${{ inputs.region_prd }}
      service_name: ${{ inputs.service_name_prd != '' && inputs.service_name_prd || inputs.service_name }}
      image_ref: ${{ needs.tag_release_image.outputs.image_ref }}
      expected_image_digest: ${{ needs.resolve_digest.outputs.digest }}
      require_image_digest: false
      revision_tag: ${{ needs.tag_release_image.outputs.tag_name }}
      gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider_prd }}
      gcp_deploy_service_account: ${{ inputs.gcp_deploy_service_account_prd }}
      runtime_service_account: ${{ inputs.runtime_service_account_prd }}
      gcloud_version: ${{ inputs.gcloud_version }}
      timeout_job: ${{ inputs.timeout_job }}


  sync_release_to_main:
    name: Sync Release To Main 🔁
    needs: [ctx, release_please_publish, tag_release_image, deploy_prd]
    if: >-
      ${{
        always() &&
        needs.release_please_publish.result == 'success' &&
        needs.tag_release_image.result == 'success' &&
        needs.release_please_publish.outputs.releases_created == 'true' &&
        needs.release_please_publish.outputs.tag_name != '' &&
        (
          inputs.enable_deploy_prd != 'true' ||
          needs.deploy_prd.result == 'success'
        )
      }}
    runs-on: ${{ fromJson(inputs.runs_on) }}
    permissions:
      pull-requests: write
      contents: write
    outputs:
      pr_url: ${{ steps.sync_pr.outputs.pr_url }}
      pr_number: ${{ steps.sync_pr.outputs.pr_number }}
    steps:
      - name: Open PR Release To Main
        id: sync_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.HEAD_BRANCH;
            const base = process.env.BASE_BRANCH;
            const tag = process.env.TAG_NAME;

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_number', String(pr.number));
              core.info(`Já existe PR aberta: ${pr.html_url}`);
              return;
            }

            try {
              const title = `chore(sync): ${head} To ${base} (${tag})`;
              const body = `Sync automático após release publish.\n\nTag: \`${tag}\``;
              const pr = await github.rest.pulls.create({ owner, repo, head, base, title, body });
              core.setOutput('pr_url', pr.data.html_url);
              core.setOutput('pr_number', String(pr.number));
              core.notice(`PR criada: ${pr.data.html_url}`);
            } catch (error) {
              core.warning(error.message);
              core.setOutput('pr_url', '');
              core.setOutput('pr_number', '');
            }
        env:
          HEAD_BRANCH: ${{ needs.ctx.outputs.head_branch }}
          BASE_BRANCH: ${{ inputs.main_branch }}
          TAG_NAME: ${{ needs.release_please_publish.outputs.tag_name }}


  summary:
    name: Summary 📜
    needs:
      - ctx
      - registry
      - build
      - resolve_digest
      - deploy_hml
      - release_please_pr
      - release_please_publish
      - tag_release_image
      - deploy_prd
      - sync_release_to_main
    runs-on: ${{ fromJson(inputs.runs_on) }}
    if: ${{ always() }}
    steps:
      - name: Final Summary
        env:
          RP_PR_URL: ${{ needs.release_please_pr.outputs.pr_url }}
          RP_PR_NUM: ${{ needs.release_please_pr.outputs.pr_number }}
          SYNC_PR_URL: ${{ needs.sync_release_to_main.outputs.pr_url }}
          SYNC_PR_NUM: ${{ needs.sync_release_to_main.outputs.pr_number }}
        run: |
          set -euo pipefail

          link_or_none() {
            local label="$1" number="$2" url="$3"
            if [[ -n "$url" && "$url" == http* ]]; then
              if [[ -n "$number" ]]; then
                echo "- ${label}: [#${number}](${url})"
              else
                echo "- ${label}: ${url}"
              fi
            else
              echo "- ${label}: <none>"
            fi
          }

          {
            echo "## Release Flow Cloud Run — Resumo"
            echo
            echo "### Context"
            echo "- event: \`${{ needs.ctx.outputs.event_name }}\`"
            echo "- head_branch: \`${{ needs.ctx.outputs.head_branch }}\`"
            echo "- promo_ref: \`${{ needs.ctx.outputs.promo_ref || 'Not Promo' }}\`"
            echo "- promotion: \`${{ needs.ctx.outputs.should_run_release_promotion }}\`"
            echo "- release_please_pr: \`${{ needs.ctx.outputs.should_run_release_please_pr }}\`"
            echo "- release_please_publish: \`${{ needs.ctx.outputs.should_run_release_please_publish }}\`"
            echo
            echo "### Artifact"
            echo "- GAR image: \`${{ needs.registry.outputs.image_uri || 'n/a' }}\`"
            echo "- promotion image: \`${{ needs.resolve_digest.outputs.image_by_digest || 'n/a' }}\`"
            echo "- digest: \`${{ needs.resolve_digest.outputs.digest || 'n/a' }}\`"
            echo "- used tag: \`${{ needs.resolve_digest.outputs.used_tag || 'n/a' }}\`"
            echo "- release image: \`${{ needs.tag_release_image.outputs.image_ref || 'n/a' }}\`"
            echo "- SemVer: \`${{ needs.release_please_publish.outputs.tag_name || 'n/a' }}\`"
            echo "- PRD revision tag: \`${{ needs.deploy_prd.outputs.revision_tag || 'n/a' }}\`"
            echo
            echo "### Environments"
            echo "- HML: \`${{ needs.deploy_hml.result || 'skipped' }}\` — ${{ needs.deploy_hml.outputs.service_url || 'n/a' }}"
            echo "- PRD: \`${{ needs.deploy_prd.result || 'skipped' }}\` — ${{ needs.deploy_prd.outputs.service_url || 'n/a' }}"
            echo
            echo "### Jobs"
            echo "- registry: \`${{ needs.registry.result || 'skipped' }}\`"
            echo "- build: \`${{ needs.build.result || 'skipped' }}\`"
            echo "- resolve_digest: \`${{ needs.resolve_digest.result || 'skipped' }}\`"
            echo "- release_please_pr: \`${{ needs.release_please_pr.result || 'skipped' }}\`"
            echo "- release_please_publish: \`${{ needs.release_please_publish.result || 'skipped' }}\`"
            echo "- tag_release_image: \`${{ needs.tag_release_image.result || 'skipped' }}\`"
            echo "- sync_release_to_main: \`${{ needs.sync_release_to_main.result || 'skipped' }}\`"
            echo
            echo "### Pull Requests"
            link_or_none "Release Please PR" "$RP_PR_NUM" "$RP_PR_URL"
            link_or_none "Sync PR (release → main)" "$SYNC_PR_NUM" "$SYNC_PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
