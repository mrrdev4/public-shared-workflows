name: Sonar Scan NodeJs 🟢

on:
  workflow_call:
    outputs:
      sonar_dashboard_url:
        value: ${{ jobs.sonar.outputs.sonar_dashboard_url }}
      quality_gate_status:
        value: ${{ jobs.sonar.outputs.quality_gate_status }}
      sonar_coverage:
        value: ${{ jobs.sonar.outputs.sonar_coverage }}
      sonar_new_coverage:
        value: ${{ jobs.sonar.outputs.sonar_new_coverage }}
      sonar_required_coverage:
        value: ${{ jobs.sonar.outputs.sonar_required_coverage }}
      sonar_required_new_coverage:
        value: ${{ jobs.sonar.outputs.sonar_required_new_coverage }}

    inputs:
      runs_on:
        description: Runner labels (ex. ["self-hosted","dev"])
        type: string
        required: false
        default: '["self-hosted","dev"]'

      context:
        description: Diretório do projeto Node.js (default .)
        type: string
        required: false
        default: "."

      # ---- Node.js ----
      node-version:
        description: Versão do Node.js (ex. 20, 22)
        type: string
        required: false
        default: "24"

      python-version:
        description: Versão do Python para o step de extração de hostname (pode ser necessário em runners self-hosted sem openssl ou com openssl quebrado)
        type: string
        required: false
        default: "3.12"

      # ---- Sonar Host ----
      sonar_host_url:
        description: URL do SonarQube (ex https://sonar.vtal.com)
        type: string
        required: false
        default: "${{ vars.SONAR_HOST_URL }}"

      # Desliga unit tests + coverage
      unit_tests_enabled:
        description: "Se false, não roda testes/coverage e o Sonar roda sem coverage."
        type: boolean
        required: false
        default: true

      coverage_required:
        description: "Se true e unit_tests_enabled=true, falha se o arquivo de coverage não existir/estiver vazio."
        type: boolean
        required: false
        default: false

      # ---- Sonar ----
      sonar_enabled:
        type: boolean
        required: false
        default: true

      sonar_project_key:
        type: string
        required: false
        default: ""

      sonar_project_name:
        type: string
        required: false
        default: ""

      sonar_sources:
        type: string
        required: false
        default: "."

      sonar_tests:
        type: string
        required: false
        default: "."

      sonar_test_inclusions:
        type: string
        required: false
        default: "**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx"

      sonar_exclusions:
        type: string
        required: false
        default: ""

      # Padrão mais comum (Jest/Vitest): coverage/lcov.info
      sonar_coverage:
        type: string
        required: false
        default: "coverage/lcov.info"

      sonar_project_version:
        description: "Se vazio, calcula SHA7 / pr-<num>-<sha7>-rc"
        type: string
        required: false
        default: ""

      sonar_quality_gate_timeout_sec:
        type: number
        required: false
        default: 300

      sonar_extra_args:
        type: string
        required: false
        default: ""

    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_ROOT_CERT:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: node-sonar-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sonar:
    name: Sonar Scan 🔍
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: 15

    outputs:
      quality_gate_status: ${{ steps.quality-gate.outputs.quality-gate-status }}
      sonar_dashboard_url: ${{ steps.dashboard.outputs.sonar_dashboard_url }}
      sonar_coverage: ${{ steps.dashboard.outputs.sonar_coverage }}
      sonar_new_coverage: ${{ steps.dashboard.outputs.sonar_new_coverage }}
      sonar_required_coverage: ${{ steps.dashboard.outputs.sonar_required_coverage }}
      sonar_required_new_coverage: ${{ steps.dashboard.outputs.sonar_required_new_coverage }}

    env:
      SONAR_HOST_URL: ${{ inputs.sonar_host_url }}

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Context 📁
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::package.json não encontrado no contexto '${{ inputs.context }}'."
            exit 1
          fi

      - name: Setup Java ⚒️
        if: ${{ inputs.sonar_enabled }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Detect Package Manager 🔎
        id: pm
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail

          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=pnpm run" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "run_cmd=yarn" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm install" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up Node.js 🟢
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack 📦
        if: ${{ steps.pm.outputs.pm != 'npm' }}
        run: corepack enable

      - name: Install Dependencies 📦
        working-directory: ${{ inputs.context }}
        run: ${{ steps.pm.outputs.install_cmd }}

      - name: Detect Scripts 🔎
        id: scripts
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail

          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts || {};

          const has = (name) =>
            Object.prototype.hasOwnProperty.call(scripts, name);

          const out = (key, value) =>
            process.stdout.write(`${key}=${value}\n`);

          out('has_build', has('build') ? 'true' : 'false');
          out('has_test', has('test') ? 'true' : 'false');

          if (has('test:coverage')) {
            out('has_test_coverage', 'true');
            out('coverage_script', 'test:coverage');
          } else if (has('test:cov')) {
            out('has_test_coverage', 'true');
            out('coverage_script', 'test:cov');
          } else if (has('coverage')) {
            out('has_test_coverage', 'true');
            out('coverage_script', 'coverage');
          } else if (has('test:all')) {
            out('has_test_coverage', 'true');
            out('coverage_script', 'test:all');
          } else {
            out('has_test_coverage', 'false');
            out('coverage_script', '');
          }
          NODE

      - name: Node Build 🧱
        if: ${{ steps.scripts.outputs.has_build == 'true' }}
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          ${{ steps.pm.outputs.run_cmd }} build

      - name: Tests & Coverage 🧪
        if: >-
          ${{
            inputs.sonar_enabled &&
            inputs.unit_tests_enabled &&
            (
              steps.scripts.outputs.has_test_coverage == 'true' ||
              steps.scripts.outputs.has_test == 'true'
            )
          }}
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail

          if [[ "${{ steps.scripts.outputs.has_test_coverage }}" == "true" ]]; then
            echo "Executando script de coverage: ${{ steps.scripts.outputs.coverage_script }}"
            ${{ steps.pm.outputs.run_cmd }} "${{ steps.scripts.outputs.coverage_script }}"
          else
            echo "Script dedicado de coverage não encontrado. Executando fallback: test --coverage"
            ${{ steps.pm.outputs.run_cmd }} test -- --coverage
          fi

      - name: Warn Missing Test Script ⚠️
        if: >-
          ${{
            inputs.sonar_enabled &&
            inputs.unit_tests_enabled &&
            steps.scripts.outputs.has_test_coverage != 'true' &&
            steps.scripts.outputs.has_test != 'true'
          }}
        working-directory: ${{ inputs.context }}
        run: |
          echo "::warning::Nenhum script test, test:coverage, test:cov, coverage ou test:all foi encontrado no package.json."

      - name: Verify Coverage File ✅
        id: cov
        if: ${{ inputs.sonar_enabled && inputs.unit_tests_enabled && inputs.sonar_coverage != '' }}
        working-directory: ${{ inputs.context }}
        env:
          REQUIRED: ${{ inputs.coverage_required }}
          COVERAGE_FILE: ${{ inputs.sonar_coverage }}
        run: |
          set -euo pipefail

          if [[ -f "$COVERAGE_FILE" && -s "$COVERAGE_FILE" ]]; then
            echo "Coverage encontrado: $COVERAGE_FILE"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Coverage file not found or empty: $COVERAGE_FILE"
          echo "Diretório atual: $(pwd)"
          echo "Arquivos lcov.info encontrados no contexto:"
          find . -type f -name 'lcov.info' -print || true

          if [[ "$REQUIRED" == "true" ]]; then
            echo "::error::Coverage is required but file is missing/empty: $COVERAGE_FILE"
            exit 1
          fi

      - name: Trust SonarQube Certificate 🔐
        if: ${{ inputs.sonar_enabled }}
        env:
          SONAR_ROOT_CERT: ${{ secrets.SONAR_ROOT_CERT }}
        run: |
          set -euo pipefail

          if [[ -z "${SONAR_HOST_URL}" ]]; then
            echo "::error::inputs.sonar_host_url está vazio."
            exit 1
          fi

          HOST="$(python3 -c 'import os,urllib.parse; print(urllib.parse.urlparse(os.environ["SONAR_HOST_URL"]).hostname)')"
          TRUSTSTORE=/tmp/my_truststore
          CACERT_PEM=/tmp/sonar-ca.pem

          cp -p "$JAVA_HOME/lib/security/cacerts" "$TRUSTSTORE"

          if [[ -n "${SONAR_ROOT_CERT:-}" ]]; then
            echo "✔ Usando SONAR_ROOT_CERT."
            printf '%s\n' "$SONAR_ROOT_CERT" > "$CACERT_PEM"
            keytool -delete -alias sonarqube-ca -keystore "$TRUSTSTORE" -storepass changeit >/dev/null 2>&1 || true
            keytool -importcert -noprompt -trustcacerts \
              -alias sonarqube-ca \
              -file "$CACERT_PEM" \
              -keystore "$TRUSTSTORE" \
              -storepass changeit
          else
            echo "⚠ SONAR_ROOT_CERT não informado; fallback openssl."
            rm -f /tmp/sonar-*.crt "$CACERT_PEM" || true
            openssl s_client -showcerts -servername "$HOST" -connect "$HOST:443" </dev/null 2>/dev/null \
              | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > "$CACERT_PEM"

            awk '
              /BEGIN CERTIFICATE/ {i++; f=sprintf("/tmp/sonar-%02d.crt", i)}
              {if (i>0) print > f}
              /END CERTIFICATE/ {close(f)}
            ' "$CACERT_PEM"

            i=1
            while true; do
              f=$(printf "/tmp/sonar-%02d.crt" "$i")
              [[ -f "$f" ]] || break
              alias=$(printf "sonarqube-%s-%02d" "$HOST" "$i")
              keytool -delete -alias "$alias" -keystore "$TRUSTSTORE" -storepass changeit >/dev/null 2>&1 || true
              keytool -importcert -noprompt -trustcacerts \
                -alias "$alias" \
                -file "$f" \
                -keystore "$TRUSTSTORE" \
                -storepass changeit
              i=$((i+1))
            done
          fi

          echo "NODE_EXTRA_CA_CERTS=$CACERT_PEM" >> "$GITHUB_ENV"

      - name: Build Sonar args 🧩
        id: sonarargs
        if: ${{ inputs.sonar_enabled }}
        run: |
          set -euo pipefail

          if [[ -z "${{ inputs.sonar_project_key }}" ]]; then
            echo "::error::inputs.sonar_project_key está vazio."
            exit 1
          fi

          if [[ -z "${{ secrets.SONAR_TOKEN }}" ]]; then
            echo "::error::secrets.SONAR_TOKEN não informado."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ inputs.sonar_project_version }}"
          if [[ -z "$VERSION" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              VERSION="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}-rc"
            else
              VERSION="$SHORT_SHA"
            fi
          fi

          PROJECT_NAME="${{ inputs.sonar_project_name }}"
          if [[ -z "$PROJECT_NAME" ]]; then
            PROJECT_NAME="${GITHUB_REPOSITORY##*/}"
          fi

          HAVE_COV="false"
          if [[ "${{ inputs.unit_tests_enabled }}" == "true" && "${{ inputs.sonar_coverage }}" != "" && "${{ steps.cov.outputs.found || 'false' }}" == "true" ]]; then
            HAVE_COV="true"
          fi

          {
            echo "-Dsonar.sourceEncoding=UTF-8"
            echo "-Dsonar.projectVersion=$VERSION"
            echo "-Dsonar.projectKey=${{ inputs.sonar_project_key }}"
            echo "-Dsonar.projectName=$PROJECT_NAME"
            echo "-Dsonar.sources=${{ inputs.sonar_sources }}"
            echo "-Dsonar.verbose=true"

            [[ -n "${{ inputs.sonar_tests }}" ]] && echo "-Dsonar.tests=${{ inputs.sonar_tests }}"
            [[ -n "${{ inputs.sonar_test_inclusions }}" ]] && echo "-Dsonar.test.inclusions=${{ inputs.sonar_test_inclusions }}"
            [[ -n "${{ inputs.sonar_exclusions }}" ]] && echo "-Dsonar.exclusions=${{ inputs.sonar_exclusions }}"

            if [[ "$HAVE_COV" == "true" ]]; then
              echo "-Dsonar.javascript.lcov.reportPaths=${{ inputs.sonar_coverage }}"
            fi

            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
              echo "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
              echo "-Dsonar.pullrequest.branch=${{ github.head_ref }}"
              echo "-Dsonar.pullrequest.base=${{ github.base_ref }}"
            else
              echo "-Dsonar.branch.name=${{ github.ref_name }}"
            fi

            [[ -n "${{ inputs.sonar_extra_args }}" ]] && echo "${{ inputs.sonar_extra_args }}"
          } > /tmp/sonar_args.txt

          {
            echo "args<<EOF"
            cat /tmp/sonar_args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sonar Scan 🔍
        if: ${{ inputs.sonar_enabled }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.context }}
          args: ${{ steps.sonarargs.outputs.args }}
        env:
          SONAR_SCANNER_OPTS: "-Djavax.net.ssl.trustStore=/tmp/my_truststore -Djavax.net.ssl.trustStorePassword=changeit"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Quality Gate 🧱
        id: quality-gate
        if: ${{ inputs.sonar_enabled }}
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: ${{ inputs.sonar_quality_gate_timeout_sec }}
          scanMetadataReportFile: ${{ inputs.context }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Compute Dashboard URL 🔗
        id: dashboard
        if: ${{ inputs.sonar_enabled }}
        env:
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error

          sonar_host = os.environ["SONAR_HOST_URL"].rstrip("/")
          project_key = os.environ["SONAR_PROJECT_KEY"]
          token = os.environ["SONAR_TOKEN"]
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          pr_number = os.environ.get("GITHUB_PR_NUMBER", "")

          def sonar_get(path: str, params: dict, fallback_keys=None):
              fallback_keys = set(fallback_keys or [])
              auth = base64.b64encode(f"{token}:".encode()).decode()

              def do_request(p):
                  url = f"{sonar_host}{path}?{urllib.parse.urlencode(p)}"
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Basic {auth}"
                  })
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())

              try:
                  return do_request(params)
              except urllib.error.HTTPError:
                  if fallback_keys:
                      reduced = {k: v for k, v in params.items() if k not in fallback_keys}
                      return do_request(reduced)
                  raise

          encoded_key = urllib.parse.quote(project_key, safe="")
          dashboard_url = f"{sonar_host}/dashboard?id={encoded_key}"

          measures_params = {
              "component": project_key,
              "metricKeys": "coverage,new_coverage",
          }
          gate_params = {
              "projectKey": project_key,
          }

          if event_name in ("pull_request", "pull_request_target") and pr_number:
              measures_params["pullRequest"] = pr_number
              gate_params["pullRequest"] = pr_number
              fallback_keys = {"pullRequest"}
          elif ref_name and ref_name not in ("main", "master"):
              measures_params["branch"] = ref_name
              gate_params["branch"] = ref_name
              fallback_keys = {"branch"}
          else:
              fallback_keys = set()

          measures = sonar_get(
              "/api/measures/component",
              measures_params,
              fallback_keys=fallback_keys,
          )
          gate = sonar_get(
              "/api/qualitygates/project_status",
              gate_params,
              fallback_keys=fallback_keys,
          )

          metric_map = {}
          for m in measures.get("component", {}).get("measures", []):
              metric_map[m.get("metric")] = m.get("value")

          coverage = metric_map.get("coverage", "N/A")
          new_coverage = metric_map.get("new_coverage", "N/A")

          gate_status = gate.get("projectStatus", {}).get("status", "N/A")
          conditions = gate.get("projectStatus", {}).get("conditions", [])

          required_coverage = "N/A"
          required_new_coverage = "N/A"

          for c in conditions:
              metric = c.get("metricKey")
              threshold = c.get("errorThreshold", "N/A")
              if metric == "coverage":
                  required_coverage = threshold
              elif metric == "new_coverage":
                  required_new_coverage = threshold

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"sonar_dashboard_url={dashboard_url}\n")
              f.write(f"sonar_coverage={coverage}\n")
              f.write(f"sonar_new_coverage={new_coverage}\n")
              f.write(f"sonar_required_coverage={required_coverage}\n")
              f.write(f"sonar_required_new_coverage={required_new_coverage}\n")
              f.write(f"sonar_quality_gate_status_api={gate_status}\n")
          PY

      - name: Summary 📄
        if: ${{ inputs.sonar_enabled && always() }}
        run: |
          {
            echo "## SonarQube Analysis Summary 🧫"
            if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
              echo "- ✅ PR: #${{ github.event.pull_request.number }} (\`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`)"
            else
              echo "- ✅ Branch: \`${{ github.ref_name }}\`"
            fi
            echo "- ✅ Project: \`${{ inputs.sonar_project_key }}\`"
            echo "- 🧪 Unit tests enabled: \`${{ inputs.unit_tests_enabled }}\`"
            echo "- 📊 Coverage file: \`${{ inputs.sonar_coverage }}\`"
            echo "- 📊 Coverage found: \`${{ steps.cov.outputs.found || 'false' }}\`"
            echo "- ✅ Dashboard: ${{ steps.dashboard.outputs.sonar_dashboard_url || 'not-generated' }}"
            echo "- ✅ QualityGate: \`${{ steps.quality-gate.outputs.quality-gate-status || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
