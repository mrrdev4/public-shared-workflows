name: Sonar Scan Java ☕ (Maven/Gradle Plugin)

on:
  workflow_call:
    outputs:
      sonar_dashboard_url:
        value: ${{ jobs.sonar.outputs.sonar_dashboard_url }}
      quality_gate_status:
        value: ${{ jobs.sonar.outputs.quality_gate_status }}
      sonar_coverage:
        value: ${{ jobs.sonar.outputs.sonar_coverage }}
      sonar_new_coverage:
        value: ${{ jobs.sonar.outputs.sonar_new_coverage }}
      sonar_required_coverage:
        value: ${{ jobs.sonar.outputs.sonar_required_coverage }}
      sonar_required_new_coverage:
        value: ${{ jobs.sonar.outputs.sonar_required_new_coverage }}

    inputs:
      runs_on:
        description: Runner labels (ex. ["self-hosted","dev"])
        type: string
        required: false
        default: '["self-hosted","dev"]'

      context:
        description: Diretório do projeto Java (default .)
        type: string
        required: false
        default: "."

      # ---- Java / JDK ----
      java-version:
        type: string
        required: false
        default: "21"
      java-distribution:
        type: string
        required: false
        default: "temurin"

      # ---- Maven (deps privadas) ----
      server-id:
        description: ID do servidor Maven no settings.xml (se precisar)
        type: string
        required: false
        default: ""
      maven-username:
        description: Username para o server-id (se precisar)
        type: string
        required: false
        default: ""

      # ---- Build / Tests ----
      unit_tests_enabled:
        description: "Se false, não roda testes/coverage (mas compila)."
        type: boolean
        required: false
        default: true

      coverage_required:
        description: "Se true e unit_tests_enabled=true, falha se não encontrar o JaCoCo XML."
        type: boolean
        required: false
        default: false

      # Comandos padrão (ajuste se seu projeto precisar)
      maven_cmd:
        description: "Comando Maven para build/test (sem sonar) quando unit_tests_enabled=true."
        type: string
        required: false
        default: "mvn -B -ntp -DskipTests=false test"

      gradle_cmd:
        description: "Comando Gradle para build/test (sem sonar) quando unit_tests_enabled=true (ex: test)."
        type: string
        required: false
        default: "test"

      # ---- Sonar ----
      sonar_enabled:
        type: boolean
        required: false
        default: true

      sonar_host_url:
        description: "URL do SonarQube (https://...)"
        type: string
        required: false
        default: "${{ vars.SONAR_HOST_URL }}"

      sonar_project_key:
        type: string
        required: false
        default: ""
      sonar_project_name:
        type: string
        required: false
        default: ""

      sonar_sources:
        type: string
        required: false
        default: "."
      sonar_tests:
        type: string
        required: false
        default: ""
      sonar_test_inclusions:
        type: string
        required: false
        default: ""
      sonar_exclusions:
        type: string
        required: false
        default: ""

      # Se vazio, o workflow tenta autodetectar caminhos comuns
      sonar_coverage:
        description: "Caminho do JaCoCo XML relativo ao context (ex: target/site/jacoco/jacoco.xml)."
        type: string
        required: false
        default: ""

      sonar_quality_gate_timeout_sec:
        type: number
        required: false
        default: 300

      sonar_extra_args:
        type: string
        required: false
        default: ""

      sonar_maven_plugin_version:
        description: "Versão explícita do sonar-maven-plugin (evita warning)."
        type: string
        required: false
        default: "5.5.0.6356"

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_ROOT_CERT:
        required: false
      MAVEN_PASSWORD:
        required: false
      NEXUS_PASS:
        required: false
      NEXUS_USER:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: java-sonar-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sonar:
    name: SonarQube Scan 🔍
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: 45

    outputs:
      sonar_dashboard_url: ${{ steps.dashboard.outputs.sonar_dashboard_url }}
      quality_gate_status: ${{ steps.quality_gate.outputs.quality-gate-status }}
      sonar_coverage: ${{ steps.dashboard.outputs.sonar_coverage }}
      sonar_new_coverage: ${{ steps.dashboard.outputs.sonar_new_coverage }}
      sonar_required_coverage: ${{ steps.dashboard.outputs.sonar_required_coverage }}
      sonar_required_new_coverage: ${{ steps.dashboard.outputs.sonar_required_new_coverage }}

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Context 📁
        run: |
          set -euo pipefail
          test -d "${{ inputs.context }}"

      - name: Validate Sonar Config 🧾
        if: ${{ inputs.sonar_enabled }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.sonar_host_url }}" || { echo "::error::inputs.sonar_host_url é obrigatório quando sonar_enabled=true"; exit 1; }
          test -n "${{ inputs.sonar_project_key }}" || { echo "::error::inputs.sonar_project_key é obrigatório quando sonar_enabled=true"; exit 1; }
          test -n "${{ inputs.sonar_project_name }}" || { echo "::error::inputs.sonar_project_name é obrigatório quando sonar_enabled=true"; exit 1; }

      - name: Detect Build Tool 🔎
        id: bt
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          if [[ -f "pom.xml" ]]; then
            echo "tool=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f "gradlew" ]]; then
            echo "tool=gradle-wrapper" >> "$GITHUB_OUTPUT"
          elif compgen -G "build.gradle*" > /dev/null; then
            echo "tool=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum pom.xml ou build.gradle encontrado no context." >&2
            exit 1
          fi

      # Credenciais Maven (sem vars; via inputs + secret)
      - name: Decide Maven Credentials ✅
        id: mvn_creds
        env:
          SERVER_ID: ${{ inputs.server-id }}
          MVN_USER: ${{ inputs.maven-username }}
          MVN_PASS: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          use="false"
          if [[ -n "${SERVER_ID}" && -n "${MVN_USER}" && -n "${MVN_PASS}" ]]; then
            use="true"
          fi
          echo "use=${use}" >> "$GITHUB_OUTPUT"

      - name: Set Up Java ☕ (com settings.xml)
        if: ${{ steps.mvn_creds.outputs.use == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          server-id: ${{ inputs.server-id }}
          server-username: ${{ inputs.maven-username }}
          server-password: ${{ secrets.MAVEN_PASSWORD }}

      - name: Set Up Java ☕
        if: ${{ steps.mvn_creds.outputs.use != 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      # Resolve wrapper/bin e instala só se necessário
      - name: Resolve Maven Bin 🧰
        if: ${{ steps.bt.outputs.tool == 'maven' }}
        id: mvn
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          need="false"
          bin=""
          if [[ -f "./mvnw" ]]; then
            chmod +x ./mvnw || true
            bin="./mvnw"
          elif command -v mvn >/dev/null 2>&1; then
            bin="mvn"
          else
            need="true"
            bin="mvn"
          fi
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          echo "need_setup=${need}" >> "$GITHUB_OUTPUT"

      - name: Install Maven 🗃️
        if: ${{ steps.bt.outputs.tool == 'maven' && steps.mvn.outputs.need_setup == 'true' }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.4"

      - name: Resolve Gradle Bin 🧰
        if: ${{ steps.bt.outputs.tool == 'gradle' || steps.bt.outputs.tool == 'gradle-wrapper' }}
        id: grd
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          need="false"
          bin=""
          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew || true
            bin="./gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            bin="gradle"
          else
            need="true"
            bin="gradle"
          fi
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          echo "need_setup=${need}" >> "$GITHUB_OUTPUT"

      - name: Install Gradle ⚡
        if: ${{ steps.bt.outputs.tool == 'gradle' && steps.grd.outputs.need_setup == 'true' }}
        uses: gradle/actions/setup-gradle@v6

      - name: Trust SonarQube Certificate 🔐
        if: ${{ inputs.sonar_enabled }}
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host_url || vars.SONAR_HOST_URL }}
          SONAR_ROOT_CERT: ${{ secrets.SONAR_ROOT_CERT }}
        run: |
          set -euo pipefail

          HOST="$(python3 -c 'import os,urllib.parse; print(urllib.parse.urlparse(os.environ["SONAR_HOST_URL"]).hostname)')"
          TRUSTSTORE=/tmp/my_truststore
          CACERT_PEM=/tmp/sonar-ca.pem

          cp -p "$JAVA_HOME/lib/security/cacerts" "$TRUSTSTORE"

          if [[ -n "${SONAR_ROOT_CERT:-}" ]]; then
            echo "✔ Usando SONAR_ROOT_CERT."
            printf '%s\n' "$SONAR_ROOT_CERT" > "$CACERT_PEM"
            keytool -delete -alias sonarqube-ca -keystore "$TRUSTSTORE" -storepass changeit >/dev/null 2>&1 || true
            keytool -importcert -noprompt -trustcacerts \
              -alias sonarqube-ca \
              -file "$CACERT_PEM" \
              -keystore "$TRUSTSTORE" \
              -storepass changeit
          else
            echo "⚠ SONAR_ROOT_CERT não informado; fallback openssl."
            rm -f /tmp/sonar-*.crt "$CACERT_PEM" || true
            openssl s_client -showcerts -servername "$HOST" -connect "$HOST:443" </dev/null 2>/dev/null \
              | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > "$CACERT_PEM"

            awk '
              /BEGIN CERTIFICATE/ {i++; f=sprintf("/tmp/sonar-%02d.crt", i)}
              {if (i>0) print > f}
              /END CERTIFICATE/ {close(f)}
            ' "$CACERT_PEM"

            i=1
            while true; do
              f=$(printf "/tmp/sonar-%02d.crt" "$i")
              [[ -f "$f" ]] || break
              alias=$(printf "sonarqube-%s-%02d" "$HOST" "$i")
              keytool -delete -alias "$alias" -keystore "$TRUSTSTORE" -storepass changeit >/dev/null 2>&1 || true
              keytool -importcert -noprompt -trustcacerts \
                -alias "$alias" \
                -file "$f" \
                -keystore "$TRUSTSTORE" \
                -storepass changeit
              i=$((i+1))
            done
          fi

          # Node (quality-gate action)
          echo "NODE_EXTRA_CA_CERTS=$CACERT_PEM" >> "$GITHUB_ENV"

          # Java/Maven/Gradle (maven/gradle plugin)
          OPTS="-Djavax.net.ssl.trustStore=$TRUSTSTORE -Djavax.net.ssl.trustStorePassword=changeit"
          echo "JAVA_TOOL_OPTIONS=$OPTS" >> "$GITHUB_ENV"
          echo "MAVEN_OPTS=$OPTS" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=$OPTS" >> "$GITHUB_ENV"

      - name: Compute Project Version/Tag 🏷️
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "pull_request" ]]; then
            SHA7="${PR_HEAD_SHA:0:7}"
            TAG="pr-${PR_NUM}-${SHA7}-rc"
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Build/Test/Coverage
      - name: Build/Test Maven 🧪
        if: ${{ steps.bt.outputs.tool == 'maven' }}
        env:
          JAVA_TOOL_OPTIONS: ${{ env.JAVA_TOOL_OPTIONS }}
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          MVN_BIN="${{ steps.mvn.outputs.bin }}"

          CMD="${{ inputs.maven_cmd }}"
          if [[ "${{ inputs.unit_tests_enabled }}" != "true" ]]; then
            CMD="mvn -B -ntp -DskipTests=true package"
          fi

          case "$CMD" in
            mvn\ *|mvn)       CMD="${CMD/mvn/$MVN_BIN}" ;;
            ./mvnw\ *|./mvnw) CMD="${CMD/\.\/mvnw/$MVN_BIN}" ;;
          esac

          echo "Running: $CMD"
          eval "$CMD"

          if [[ "${{ inputs.unit_tests_enabled }}" == "true" ]]; then
            "$MVN_BIN" -B -ntp jacoco:report || true
          fi

      - name: Build/Test Gradle 🧪
        if: ${{ steps.bt.outputs.tool == 'gradle' || steps.bt.outputs.tool == 'gradle-wrapper' }}
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail
          GRD_BIN="${{ steps.grd.outputs.bin }}"

          if [[ "${{ inputs.unit_tests_enabled }}" == "true" ]]; then
            "$GRD_BIN" --no-daemon ${{ inputs.gradle_cmd }}
            if "$GRD_BIN" --no-daemon tasks --all | grep -qE '(^|\s)jacocoTestReport(\s|$)'; then
              "$GRD_BIN" --no-daemon jacocoTestReport || true
            fi
          else
            # compila sem testes (para Sonar Java)
            "$GRD_BIN" --no-daemon build -x test
          fi

      - name: Detect Coverage Path 🔎
        id: cov
        if: ${{ inputs.unit_tests_enabled }}
        working-directory: ${{ inputs.context }}
        env:
          REQUIRED: ${{ inputs.coverage_required }}
          IN_PATH: ${{ inputs.sonar_coverage }}
        run: |
          set -euo pipefail

          found="false"
          path=""

          if [[ -n "${IN_PATH}" ]]; then
            if [[ -f "${IN_PATH}" && -s "${IN_PATH}" ]]; then
              found="true"
              path="${IN_PATH}"
            fi
          else
            candidates=(
              "target/site/jacoco/jacoco.xml"
              "target/site/jacoco-it/jacoco.xml"
              "build/reports/jacoco/test/jacocoTestReport.xml"
              "build/reports/jacoco/test/jacoco.xml"
              "build/reports/jacoco/jacoco.xml"
            )
            for c in "${candidates[@]}"; do
              if [[ -f "$c" && -s "$c" ]]; then
                found="true"
                path="$c"
                break
              fi
            done
          fi

          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

          if [[ "${found}" != "true" ]]; then
            echo "::warning::JaCoCo XML não encontrado. Defina inputs.sonar_coverage ou habilite geração do report."
            if [[ "${REQUIRED}" == "true" ]]; then
              echo "::error::Coverage required, mas JaCoCo XML não foi encontrado."
              exit 1
            fi
          fi

      # Sonar via plugin (Maven/Gradle)
      - name: SonarQube Scan (Maven Plugin) 🔍
        if: ${{ inputs.sonar_enabled && steps.bt.outputs.tool == 'maven' }}
        working-directory: ${{ inputs.context }}
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
        run: |
          set -euo pipefail
          MVN_BIN="${{ steps.mvn.outputs.bin }}"
          VER="${{ inputs.sonar_maven_plugin_version }}"

          ARGS=()
          ARGS+=("-Dsonar.host.url=${SONAR_HOST_URL}")
          ARGS+=("-Dsonar.token=${SONAR_TOKEN}")

          ARGS+=("-Dsonar.projectKey=${{ inputs.sonar_project_key }}")
          ARGS+=("-Dsonar.projectName=${{ inputs.sonar_project_name }}")
          ARGS+=("-Dsonar.projectVersion=${{ steps.tag.outputs.tag }}")
          ARGS+=("-Dsonar.sources=${{ inputs.sonar_sources }}")

          [[ -n "${{ inputs.sonar_tests }}" ]] && ARGS+=("-Dsonar.tests=${{ inputs.sonar_tests }}")
          [[ -n "${{ inputs.sonar_test_inclusions }}" ]] && ARGS+=("-Dsonar.test.inclusions=${{ inputs.sonar_test_inclusions }}")
          [[ -n "${{ inputs.sonar_exclusions }}" ]] && ARGS+=("-Dsonar.exclusions=${{ inputs.sonar_exclusions }}")

          if [[ "${{ inputs.unit_tests_enabled }}" == "true" && "${{ steps.cov.outputs.found }}" == "true" ]]; then
            ARGS+=("-Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.cov.outputs.path }}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ARGS+=("-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}")
            ARGS+=("-Dsonar.pullrequest.branch=${{ github.head_ref }}")
            ARGS+=("-Dsonar.pullrequest.base=${{ github.base_ref }}")
          else
            ARGS+=("-Dsonar.branch.name=${{ github.ref_name }}")
          fi

          if [[ -n "${{ inputs.sonar_extra_args }}" ]]; then
            # shellcheck disable=SC2206
            EXTRA=(${{ inputs.sonar_extra_args }})
            ARGS+=("${EXTRA[@]}")
          fi

          echo "Running sonar-maven-plugin ${VER}..."
          "$MVN_BIN" -B -ntp "org.sonarsource.scanner.maven:sonar-maven-plugin:${VER}:sonar" "${ARGS[@]}"

      - name: SonarQube Scan (Gradle Task) 🔍
        if: ${{ inputs.sonar_enabled && (steps.bt.outputs.tool == 'gradle' || steps.bt.outputs.tool == 'gradle-wrapper') }}
        working-directory: ${{ inputs.context }}
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          set -euo pipefail
          GRD_BIN="${{ steps.grd.outputs.bin }}"

          if ! "$GRD_BIN" --no-daemon tasks --all | grep -qE '(^|\s)sonarqube(\s|$)'; then
            echo "::error::Gradle sem task 'sonarqube'. É necessário aplicar o plugin 'org.sonarqube' no build.gradle(.kts)."
            exit 1
          fi

          ARGS=()
          ARGS+=("-Dsonar.host.url=${SONAR_HOST_URL}")
          ARGS+=("-Dsonar.token=${SONAR_TOKEN}")
          ARGS+=("-Dsonar.projectKey=${{ inputs.sonar_project_key }}")
          ARGS+=("-Dsonar.projectName=${{ inputs.sonar_project_name }}")
          ARGS+=("-Dsonar.projectVersion=${{ steps.tag.outputs.tag }}")
          ARGS+=("-Dsonar.sources=${{ inputs.sonar_sources }}")

          [[ -n "${{ inputs.sonar_tests }}" ]] && ARGS+=("-Dsonar.tests=${{ inputs.sonar_tests }}")
          [[ -n "${{ inputs.sonar_test_inclusions }}" ]] && ARGS+=("-Dsonar.test.inclusions=${{ inputs.sonar_test_inclusions }}")
          [[ -n "${{ inputs.sonar_exclusions }}" ]] && ARGS+=("-Dsonar.exclusions=${{ inputs.sonar_exclusions }}")

          if [[ "${{ inputs.unit_tests_enabled }}" == "true" && "${{ steps.cov.outputs.found }}" == "true" ]]; then
            ARGS+=("-Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.cov.outputs.path }}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ARGS+=("-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}")
            ARGS+=("-Dsonar.pullrequest.branch=${{ github.head_ref }}")
            ARGS+=("-Dsonar.pullrequest.base=${{ github.base_ref }}")
          else
            ARGS+=("-Dsonar.branch.name=${{ github.ref_name }}")
          fi

          if [[ -n "${{ inputs.sonar_extra_args }}" ]]; then
            # shellcheck disable=SC2206
            EXTRA=(${{ inputs.sonar_extra_args }})
            ARGS+=("${EXTRA[@]}")
          fi

          "$GRD_BIN" --no-daemon sonarqube "${ARGS[@]}"

      - name: Locate report-task.txt 📄
        id: report
        if: ${{ inputs.sonar_enabled }}
        working-directory: ${{ inputs.context }}
        run: |
          set -euo pipefail

          candidates=(
            ".scannerwork/report-task.txt"
            "target/sonar/report-task.txt"
            "build/sonar/report-task.txt"
          )

          found=""
          for f in "${candidates[@]}"; do
            if [[ -f "$f" ]]; then
              found="$f"
              break
            fi
          done

          if [[ -z "$found" ]]; then
            echo "::error::report-task.txt não encontrado (sonar não gerou metadata)."
            echo "Tente procurar manualmente em .scannerwork/ target/sonar/ build/sonar/."
            exit 1
          fi

          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "Found report-task: $found"

      - name: Quality Gate 🧱
        id: quality_gate
        if: ${{ inputs.sonar_enabled }}
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: ${{ inputs.sonar_quality_gate_timeout_sec }}
          scanMetadataReportFile: ${{ inputs.context }}/${{ steps.report.outputs.path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}

      - name: Compute Dashboard URL + Coverage 🔗
        id: dashboard
        if: ${{ inputs.sonar_enabled }}
        env:
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error

          sonar_host = os.environ["SONAR_HOST_URL"].rstrip("/")
          project_key = os.environ["SONAR_PROJECT_KEY"]
          token = os.environ["SONAR_TOKEN"]
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          pr_number = os.environ.get("GITHUB_PR_NUMBER", "")

          def sonar_get(path: str, params: dict, fallback_keys=None):
              fallback_keys = set(fallback_keys or [])
              auth = base64.b64encode(f"{token}:".encode()).decode()

              def do_request(p):
                  url = f"{sonar_host}{path}?{urllib.parse.urlencode(p)}"
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Basic {auth}"
                  })
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())

              try:
                  return do_request(params)
              except urllib.error.HTTPError:
                  if fallback_keys:
                      reduced = {k: v for k, v in params.items() if k not in fallback_keys}
                      return do_request(reduced)
                  raise

          encoded_key = urllib.parse.quote(project_key, safe="")
          dashboard_url = f"{sonar_host}/dashboard?id={encoded_key}"

          measures_params = {
              "component": project_key,
              "metricKeys": "coverage,new_coverage",
          }
          gate_params = {
              "projectKey": project_key,
          }

          if event_name in ("pull_request", "pull_request_target") and pr_number:
              measures_params["pullRequest"] = pr_number
              gate_params["pullRequest"] = pr_number
              fallback_keys = {"pullRequest"}
          elif ref_name and ref_name not in ("main", "master"):
              measures_params["branch"] = ref_name
              gate_params["branch"] = ref_name
              fallback_keys = {"branch"}
          else:
              fallback_keys = set()

          measures = sonar_get(
              "/api/measures/component",
              measures_params,
              fallback_keys=fallback_keys,
          )
          gate = sonar_get(
              "/api/qualitygates/project_status",
              gate_params,
              fallback_keys=fallback_keys,
          )

          metric_map = {}
          for m in measures.get("component", {}).get("measures", []):
              metric_map[m.get("metric")] = m.get("value")

          coverage = metric_map.get("coverage", "N/A")
          new_coverage = metric_map.get("new_coverage", "N/A")

          gate_status = gate.get("projectStatus", {}).get("status", "N/A")
          conditions = gate.get("projectStatus", {}).get("conditions", [])

          required_coverage = "N/A"
          required_new_coverage = "N/A"

          for c in conditions:
              metric = c.get("metricKey")
              threshold = c.get("errorThreshold", "N/A")
              if metric == "coverage":
                  required_coverage = threshold
              elif metric == "new_coverage":
                  required_new_coverage = threshold

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"sonar_dashboard_url={dashboard_url}\n")
              f.write(f"sonar_coverage={coverage}\n")
              f.write(f"sonar_new_coverage={new_coverage}\n")
              f.write(f"sonar_required_coverage={required_coverage}\n")
              f.write(f"sonar_required_new_coverage={required_new_coverage}\n")
              f.write(f"sonar_quality_gate_status_api={gate_status}\n")
          PY

      - name: Summary 📄
        if: ${{ inputs.sonar_enabled && always() }}
        run: |
          {
            echo "## SonarQube Analysis Summary 🧫"
            if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
              echo "- ✅ PR: #${{ github.event.pull_request.number }} (\`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`)"
            else
              echo "- ✅ Branch: \`${{ github.ref_name }}\`"
            fi
            echo "- ✅ Project: \`${{ inputs.sonar_project_key }}\`"
            echo "- 🧪 Unit tests enabled: \`${{ inputs.unit_tests_enabled }}\`"
            echo "- 📊 Coverage file: \`${{ inputs.sonar_coverage }}\`"
            echo "- 📊 Coverage found: \`${{ steps.cov.outputs.found || 'false' }}\`"
            echo "- ✅ Dashboard: ${{ steps.dashboard.outputs.sonar_dashboard_url || 'not-generated' }}"
            echo "- ✅ QualityGate: \`${{ steps.quality-gate.outputs.quality-gate-status || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
